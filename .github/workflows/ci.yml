name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build postgres-mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp_postgres/Dockerfile
          push: false
          tags: mcp-servers/postgres-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build rest-api-mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp_rest_api/Dockerfile
          push: false
          tags: mcp-servers/rest-api-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build filesystem-mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp_filesystem/Dockerfile
          push: false
          tags: mcp-servers/filesystem-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.29.0 k8s/
