name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag (defaults to git SHA)
        required: false
        type: string

  push:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - "k8s/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "config/**"
      - ".github/workflows/deploy.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  NAMESPACE: mcp-servers

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push postgres-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp_postgres/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/postgres-mcp:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/postgres-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push rest-api-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp_rest_api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rest-api-mcp:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/rest-api-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push filesystem-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mcp_filesystem/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/filesystem-mcp:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/filesystem-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"

          if [ -z "$KUBE_CONFIG_DATA" ] && [ -f "$HOME/.kube/config" ]; then
            echo "Using existing kubeconfig on self-hosted runner"
          elif [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG secret is empty and no ~/.kube/config on runner."
            exit 1
          elif printf '%s' "$KUBE_CONFIG_DATA" | head -1 | grep -qE '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          elif printf '%s' "$KUBE_CONFIG_DATA" | tr -d ' \t\r\n' | base64 -d > "$HOME/.kube/config" 2>/dev/null \
            && [ -s "$HOME/.kube/config" ]; then
            true
          else
            echo "::error::KUBE_CONFIG is not valid. Use base64-encoded kubeconfig or paste raw YAML."
            exit 1
          fi

          chmod 600 "$HOME/.kube/config"
          echo "Using kubectl context: $(kubectl config current-context)"
          kubectl cluster-info

      - name: Create GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${GHCR_TOKEN:-$GITHUB_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No GHCR_TOKEN or GITHUB_TOKEN available for pull secret"
            exit 1
          fi
          kubectl create namespace "${{ env.NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$TOKEN" \
            --namespace="${{ env.NAMESPACE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create MCP secrets
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          if [ -n "$MCP_AUTH_TOKEN" ]; then
            kubectl create secret generic mcp-secrets \
              --from-literal=MCP_AUTH_TOKEN="$MCP_AUTH_TOKEN" \
              --namespace="${{ env.NAMESPACE }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "MCP_AUTH_TOKEN not set; skipping mcp-secrets (optional auth disabled)"
          fi

      - name: Deploy to Kubernetes
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
          export NAMESPACE="${{ env.NAMESPACE }}"

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/mcp-postgres.yaml
          kubectl apply -f k8s/mcp-rest-api.yaml
          kubectl apply -f k8s/mcp-filesystem.yaml

          kubectl set image deployment/mcp-postgres \
            mcp-postgres="${IMAGE_PREFIX}/postgres-mcp:${IMAGE_TAG}" \
            -n "$NAMESPACE"
          kubectl set image deployment/mcp-rest-api \
            mcp-rest-api="${IMAGE_PREFIX}/rest-api-mcp:${IMAGE_TAG}" \
            -n "$NAMESPACE"
          kubectl set image deployment/mcp-filesystem \
            mcp-filesystem="${IMAGE_PREFIX}/filesystem-mcp:${IMAGE_TAG}" \
            -n "$NAMESPACE"

          for dep in mcp-postgres mcp-rest-api mcp-filesystem; do
            if ! kubectl rollout status "deployment/$dep" -n "$NAMESPACE" --timeout=180s; then
              kubectl get pods -n "$NAMESPACE" -o wide
              kubectl describe pods -n "$NAMESPACE" | tail -80
              kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -20
              exit 1
            fi
          done

          kubectl get pods,svc -n "$NAMESPACE"

      - name: Verify MCP TCP ports
        run: |
          set -euo pipefail
          NAMESPACE="${{ env.NAMESPACE }}"
          for svc_port in mcp-postgres:3003 mcp-rest-api:3004 mcp-filesystem:3005; do
            svc="${svc_port%%:*}"
            port="${svc_port##*:}"
            kubectl run "tcp-check-${svc}" \
              --rm -i --restart=Never \
              --image=busybox:1.36 \
              --namespace="$NAMESPACE" \
              --command -- sh -c "nc -z -w5 ${svc}.${NAMESPACE}.svc.cluster.local ${port}"
          done
          echo "All MCP services reachable on ClusterIP"
