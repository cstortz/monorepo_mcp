apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-servers
    environment: dev
data:
  ENVIRONMENT: "dev"
  MCP_PUBLIC_HOST: "monorepo-mcp.dev.stortz.tech"
  MCP_POSTGRES_PORT: "3003"
  MCP_REST_API_PORT: "3004"
  MCP_FILESYSTEM_PORT: "3005"
  MCP_MEMORY_PORT: "3006"
  LOG_LEVEL: "INFO"
  DATABASE_WS_URL: "http://database-api.database-system.svc.cluster.local:8000"
  DATABASE_WS_REGISTRY_URL: "http://database-api.database-system.svc.cluster.local:8000/registry/mcp"
  RESUME_API_URL: "http://resume.dev.stortz.tech"
  RESUME_API_REGISTRY_URL: "http://resume.dev.stortz.tech/registry/mcp"
