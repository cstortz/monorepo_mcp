apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-filesystem
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-filesystem
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-filesystem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-filesystem
        app.kubernetes.io/component: mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mcp-filesystem
          image: ghcr.io/cstortz/monorepo_mcp/filesystem-mcp:latest
          imagePullPolicy: Always
          args:
            - python
            - -m
            - src.mcp_filesystem
            - --host
            - "0.0.0.0"
            - --port
            - "3005"
            - --log-level
            - INFO
            - --no-auth
            - --base-path
            - /data
          ports:
            - name: mcp-tcp
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: mcp-config
            - secretRef:
                name: mcp-secrets
                optional: true
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: mcp-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mcp-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-filesystem
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-filesystem
spec:
  selector:
    app.kubernetes.io/name: mcp-filesystem
  ports:
    - name: mcp-tcp
      port: 3005
      targetPort: 3005
      nodePort: 30305
  type: NodePort
