  endpoints.json: |
    {
      "environment": "dev",
      "host": "monorepo-mcp.dev.stortz.tech",
      "servers": {
        "postgres-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3003,
          "endpoint": "monorepo-mcp.dev.stortz.tech:3003",
          "uri": "http://monorepo-mcp.dev.stortz.tech/postgres-mcp/",
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3003 STDIO"
        },
        "rest-api-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3004,
          "endpoint": "monorepo-mcp.dev.stortz.tech:3004",
          "uri": "http://monorepo-mcp.dev.stortz.tech/rest-api-mcp/",
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3004 STDIO"
        },
        "filesystem-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3005,
          "endpoint": "monorepo-mcp.dev.stortz.tech:3005",
          "uri": "http://monorepo-mcp.dev.stortz.tech/filesystem-mcp/",
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3005 STDIO"
        },
        "redis-memory-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3006,
          "endpoint": "monorepo-mcp.dev.stortz.tech:3006",
          "uri": "http://monorepo-mcp.dev.stortz.tech/redis-memory/",
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3006 STDIO"
        }
      }
    }
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      server {
        listen 8080;
        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ =404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-portal
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-portal
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-portal
        environment: dev
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /endpoints.json
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: mcp-portal-content
            items:
              - key: index.html
                path: index.html
              - key: endpoints.json
                path: endpoints.json
              - key: postgres-mcp.index.html
                path: postgres-mcp/index.html
              - key: postgres-mcp.endpoints.json
                path: postgres-mcp/endpoints.json
              - key: rest-api-mcp.index.html
                path: rest-api-mcp/index.html
              - key: rest-api-mcp.endpoints.json
                path: rest-api-mcp/endpoints.json
              - key: filesystem-mcp.index.html
                path: filesystem-mcp/index.html
              - key: filesystem-mcp.endpoints.json
                path: filesystem-mcp/endpoints.json
        - name: nginx-conf
          configMap:
            name: mcp-portal-content
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-portal
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-portal
    environment: dev
spec:
  selector:
    app.kubernetes.io/name: mcp-portal
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
