apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-portal-content
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-portal
    environment: dev
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>MCP Servers (dev)</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        code { background: #f4f4f4; padding: 0.15rem 0.35rem; border-radius: 4px; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; }
      </style>
    </head>
    <body>
      <h1>Monorepo MCP — dev</h1>
      <p>Connect Cursor or other MCP clients over TCP to <strong>monorepo-mcp.dev.stortz.tech</strong> on the ports below, or open each server’s catalog URI.</p>
      <table>
        <tr><th>Server</th><th>TCP</th><th>URI</th><th>socat example</th></tr>
        <tr><td>postgres-mcp</td><td>:3003</td><td><a href="/postgres-mcp/">/postgres-mcp/</a></td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3003 STDIO</code></td></tr>
        <tr><td>rest-api-mcp</td><td>:3004</td><td><a href="/rest-api-mcp/">/rest-api-mcp/</a></td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3004 STDIO</code></td></tr>
        <tr><td>filesystem-mcp</td><td>:3005</td><td><a href="/filesystem-mcp/">/filesystem-mcp/</a></td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3005 STDIO</code></td></tr>
        <tr><td>redis-memory-mcp</td><td>:3006</td><td><a href="/redis-memory/">/redis-memory/</a></td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3006 STDIO</code></td></tr>
      </table>
      <p>Machine-readable catalog: <a href="/endpoints.json">/endpoints.json</a></p>
    </body>
    </html>
  postgres-mcp.index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><title>postgres-mcp</title></head>
