apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-portal-content
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-portal
    environment: dev
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>MCP Servers (dev)</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        code { background: #f4f4f4; padding: 0.15rem 0.35rem; border-radius: 4px; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; }
      </style>
    </head>
    <body>
      <h1>Monorepo MCP — dev</h1>
      <p>Connect Cursor or other MCP clients over TCP to <strong>monorepo-mcp.dev.stortz.tech</strong> on the ports below.</p>
      <table>
        <tr><th>Server</th><th>Port</th><th>socat example</th></tr>
        <tr><td>postgres-mcp</td><td>3003</td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3003 STDIO</code></td></tr>
        <tr><td>rest-api-mcp</td><td>3004</td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3004 STDIO</code></td></tr>
        <tr><td>filesystem-mcp</td><td>3005</td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3005 STDIO</code></td></tr>
        <tr><td>redis-memory-mcp</td><td>3006</td><td><code>socat TCP:monorepo-mcp.dev.stortz.tech:3006 STDIO</code></td></tr>
      </table>
      <p>Redis Memory docs: <a href="/redis-memory/">/redis-memory/</a></p>
      <p>Machine-readable catalog: <a href="/endpoints.json">/endpoints.json</a></p>
    </body>
    </html>
  endpoints.json: |
    {
      "environment": "dev",
      "host": "monorepo-mcp.dev.stortz.tech",
      "servers": {
        "postgres-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3003,
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3003 STDIO"
        },
        "rest-api-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3004,
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3004 STDIO"
        },
        "filesystem-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3005,
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3005 STDIO"
        },
        "redis-memory-mcp": {
          "host": "monorepo-mcp.dev.stortz.tech",
          "port": 3006,
          "protocol": "tcp",
          "socat": "socat TCP:monorepo-mcp.dev.stortz.tech:3006 STDIO",
          "docs": "https://monorepo-mcp.dev.stortz.tech/redis-memory/"
        }
      }
    }
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile      on;
      server {
        listen 8080;
        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ =404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-portal
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-portal
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-portal
        environment: dev
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /endpoints.json
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: mcp-portal-content
            items:
              - key: index.html
                path: index.html
              - key: endpoints.json
                path: endpoints.json
        - name: nginx-conf
          configMap:
            name: mcp-portal-content
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-portal
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: mcp-portal
    environment: dev
spec:
  selector:
    app.kubernetes.io/name: mcp-portal
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
